//
// Contract used by tools/capture.mjs:
//   window.READY            Promise<{frames, fps, width, height, renderer, title, bounds, vo}>, resolves after fonts are
//                           loaded (bounds = scene starts + the end, for tools/make.py and the per-scene checks)
//   window.renderFrame(i)   draws frame i; a pure function of (i / FPS, SEED); nothing carried between frames
//   window.captureFrame(i)  renderFrame(i) + returns a PNG/JPEG data URL of the canvas
//   window.renderAudio()    Promise<AudioBuffer>: the whole soundtrack, rendered OFFLINE (OfflineAudioContext)
// URL params: w, h (default 1080x1920 = 9:16), seed, capture=1 (set by capture.mjs: no preview loop),
//             shutter=<samples> (0 = motion blur off, for drafts), weave=<px>, tone=0 (finishing overrides)
//
// Renders: python3 tools/make.py stills | draft | final (KIT/references/quick-mode.md §3-4). It captures, lays the
// narration on the score (audio/mix.json), masters to -14 LUFS and runs the checks; never chain capture.mjs,
// master_audio.py and qc.py by hand.
//
// Edit only the FILM section below: TITLE, PURPOSE, FINISH, DURATION, PALETTE, TYPE (roles, check), CUES, VO, SCENES, SFX, ROOM,
// ARRANGEMENT, the scene functions and score(). Helpers stay as they are: EASE, MOTION (at, back, anticipate, spring, stagger, arc), CAM (pan, tilt, dolly, zoom, truck, crane, orbit, dollyZoom,
// pushTo, fpv, handheld, matchFrom, rackFocus), retime() (speed ramp, slow motion, time-lapse, freeze), plane(),
// TRANSITION (dissolve, wipe, whip, iris), lazy() (seeded data built once), label() (on-screen names), and the sound voices.
// Seeded data (star fields, layouts) is built with lazy() and first used inside a draw call: SEED is set further down
// the file, so a top-level rng() call here would run before it.

// ---- small tools
const kf = (t, keys) => {   // keyframes [[time, value or [x, y]], ...], eased between, held outside
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) {
    const [t0, a] = keys[i - 1], [t1, b] = keys[i], k = EASE.inOut((t - t0) / (t1 - t0));
    return Array.isArray(a) ? a.map((v, j) => lerp(v, b[j], k)) : lerp(a, b, k);
  }
  return keys[keys.length - 1][1];
};
const yay = (o) => o;   // marks a plain data object
function ik(sx, sy, hx, hy, L1, L2, dis) {   // two-bone arm: the elbow, bent away from the body (dis = +1 right, -1 left)
  const dx = hx - sx, dy = hy - sy, d = Math.min(Math.hypot(dx, dy), L1 + L2 - 1e-3), a = Math.atan2(dy, dx);
  const b = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  return [sx + Math.cos(a - dis * b) * L1, sy + Math.sin(a - dis * b) * L1];
}
function kolPoz(S,sx,sy,hx,hy,side){
  const dx=hx-sx,dy=hy-sy,d=Math.hypot(dx,dy);
  const raised=EASE.inOut(clamp((S.H*.53-hy)/(S.H*.17)));
  const l1=Math.max(S.W*lerp(.256,.220,raised),d*.565);
  const l2=Math.max(S.W*lerp(.234,.200,raised),d*.535);
  let [x,y]=ik(sx,sy,hx,hy,l1,l2,side);
  if(raised>.001){
    const reachOut=clamp(Math.abs(hx-S.W*.5)/(S.W*.35));
    const restX=sx+side*S.W*(.048+.018*reachOut);
    const restY=S.H*lerp(.482,.462,clamp((S.H*.49-hy)/(S.H*.21)));
    const k=raised*.88;
    x=lerp(x,restX,k);
    y=lerp(y,restY,k);
  }
  if(CANLI_KARE?.ad==='selam'&&side>0){
    // Dirsek omuzun altinda ve govdenin disinda; giris/cikis el ile ayni zarfi izler.
    x=lerp(x,sx+S.W*.105,CANLI_KARE.weight);
    y=lerp(y,sy+S.H*.115,CANLI_KARE.weight);
  }
  return [x,y,Math.atan2(hy-y,hx-x)];
}
function kalp(g, x, y, s) { g.beginPath(); g.moveTo(x, y + s * 0.3); g.bezierCurveTo(x - s * 0.9, y - s * 0.35, x - s * 0.35, y - s * 0.95, x, y - s * 0.4);
  g.bezierCurveTo(x + s * 0.35, y - s * 0.95, x + s * 0.9, y - s * 0.35, x, y + s * 0.3); g.closePath(); }

// ---- color & KARAKTER customization system (Part B)
const sinirla = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const araDeger = (a, b, k) => a + (b - a) * k;
function gecerliRenk(s, yedek = '#888888') {
  if (typeof s === 'string' && /^#[0-9a-fA-F]{6}$/.test(s.trim())) return s.trim().toLowerCase();
  return yedek;
}
function rgbCoz(hex) {
  const h = gecerliRenk(hex, '#888888');
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgbHex(r, g, b) {
  const c = (v) => sinirla(Math.round(v), 0, 255).toString(16).padStart(2, '0');
  return '#' + c(r) + c(g) + c(b);
}
function renkKaristir(hexA, hexB, k) {
  const [r1, g1, b1] = rgbCoz(hexA), [r2, g2, b2] = rgbCoz(hexB);
  return rgbHex(araDeger(r1, r2, k), araDeger(g1, g2, k), araDeger(b1, b2, k));
}
function rgbaRenk(hex, a) {
  const [r, g, b] = rgbCoz(hex);
  return `rgba(${r},${g},${b},${sinirla(a, 0, 1).toFixed(3)})`;
}

function karakterUygula(girdi = {}, sifirla = false) {
  if (!girdi || typeof girdi !== 'object') girdi = {};
  const baz = (girdi.preset && HAZIR_KARAKTERLER[girdi.preset] && (sifirla || Object.keys(girdi).length <= 2))

  const k = girdi.kisi && typeof girdi.kisi === 'object' ? girdi.kisi : girdi;
  const ky = girdi.kiyafet && typeof girdi.kiyafet === 'object' ? girdi.kiyafet : girdi;

  const ss = girdi.ses && typeof girdi.ses === 'object' ? girdi.ses : {};

  KARAKTER.preset = typeof girdi.preset === 'string' ? girdi.preset : baz.preset;
  KARAKTER.kisi = {
    ten: gecerliRenk(k.ten, baz.kisi.ten),
    sac: gecerliRenk(k.sac, baz.kisi.sac),
    sacModeli: ['topuz', 'atkuyrugu', 'uzun', 'kut', 'kivircik'].includes(k.sacModeli) ? k.sacModeli : baz.kisi.sacModeli,
    goz: gecerliRenk(k.goz, baz.kisi.goz),
    kasKalinligi: Number.isFinite(+k.kasKalinligi) ? sinirla(+k.kasKalinligi, 0.5, 1.8) : baz.kisi.kasKalinligi,
    dudak: gecerliRenk(k.dudak, baz.kisi.dudak),
    cil: typeof k.cil === 'boolean' ? k.cil : baz.kisi.cil,
    kupe: typeof k.kupe === 'boolean' ? k.kupe : baz.kisi.kupe,
    gozluk: typeof k.gozluk === 'boolean' ? k.gozluk : baz.kisi.gozluk,
  };
  KARAKTER.kiyafet = {
    model: ['tisort', 'uzunkollu', 'kapusonlu', 'askili', 'gomlek', 'kazak', 'salopet'].includes(ky.model) ? ky.model : baz.kiyafet.model,
    ust: gecerliRenk(ky.ust, baz.kiyafet.ust),
    ikinciRenk: gecerliRenk(ky.ikinciRenk, baz.kiyafet.ikinciRenk),
    desen: ['duz', 'yildiz', 'cicek', 'cizgili', 'puantiye'].includes(ky.desen) ? ky.desen : baz.kiyafet.desen,

  };

    simRengi: gecerliRenk(sl.simRengi, baz.slime.simRengi),
  };
  const eskiDuvar = KARAKTER.oda?.duvar;
  KARAKTER.oda = {
    duvar: gecerliRenk(od.duvar, baz.oda.duvar),

    tepsi: gecerliRenk(od.tepsi, baz.oda.tepsi),
  };
  if (eskiDuvar !== KARAKTER.oda.duvar) oda.kat = null;
  KARAKTER.yayin = {
    isim: typeof (yy.isim ?? girdi.isim) === 'string' && (yy.isim ?? girdi.isim).trim() ? (yy.isim ?? girdi.isim).trim().slice(0, 40) : baz.yayin.isim,

// ---- the room: a warm white textured wall, LED strings hanging, softly out of focus
function oda(g, S, t) {
  const W = S.W, H = S.H;
  const gr = g.createLinearGradient(0, 0, 0, H * 0.6);
  gr.addColorStop(0, ODA_PALET.duvarUst); gr.addColorStop(0.5, ODA_PALET.duvarOrta); gr.addColorStop(1, ODA_PALET.duvarAlt);
  g.fillStyle = gr; g.fillRect(0, 0, W, H * 0.62);
  // CANLI: the plaster never changes, so it is blurred once into a layer (blur on every fill cost ~130 ms a frame)
  if (!oda.kat || oda.kat.width !== W) {
    const c = document.createElement('canvas'); c.width = W; c.height = Math.ceil(H * 0.62); const k = c.getContext('2d');
    const r = rng(31); k.filter = `blur(${(W * 0.006).toFixed(1)}px)`;
    // 11. Wall plaster texture contrast reduced by ~60% so background stays calm and clean
    for (let i = 0; i < 60; i++) {
      const x = r() * W, y = r() * H * 0.58, w = W * (0.08 + r() * 0.14), h = H * (0.01 + r() * 0.02);
      k.fillStyle = r() < 0.5 ? 'rgba(255,255,255,0.14)' : 'rgba(150,135,120,0.05)'; k.beginPath(); k.ellipse(x, y, w, h, r() * 0.6 - 0.3, 0, TAU); k.fill();
    }
    oda.kat = c;
  }
  g.drawImage(oda.kat, 0, 0);
  if (!KARAKTER.oda.ledAcik) return;
  g.save();
  const [ir, ig, ib] = ODA_PALET.ledIcRgb, [mr, mg, mb] = ODA_PALET.ledOrtaRgb;
  // 11. Crisp thin vertical wires connecting the LED lights + LED glow points
  for (const [lx, salt] of [[0.08, 1], [0.21, 2], [0.36, 3], [0.62, 4], [0.79, 5], [0.93, 6]]) {
    const x0 = W * lx, rr = rng(40 + salt);
    g.strokeStyle = ODA_PALET.ledTel;
    g.lineWidth = Math.max(1.2, W * 0.0018);
    g.beginPath();
    g.moveTo(x0, 0);
    for (let y = 0; y <= H * 0.56; y += H * 0.014) {
      g.lineTo(x0 + Math.sin(y * 0.01 + salt) * W * 0.006, y);
    }
    g.stroke();
    for (let y = H * 0.01; y <= H * 0.56; y += H * 0.028) {
      const x = x0 + Math.sin(y * 0.01 + salt) * W * 0.006, tw = 0.75 + 0.25 * Math.sin(t * 2.2 + y * 0.05 + salt), rad = W * 0.0175;
      const gl = g.createRadialGradient(x, y, 0, x, y, rad);
      gl.addColorStop(0, `rgba(${ir},${ig},${ib},${(0.95 * tw).toFixed(3)})`);
      gl.addColorStop(0.32, `rgba(${mr},${mg},${mb},${(0.52 * tw).toFixed(3)})`);
      gl.addColorStop(1, `rgba(${mr},${mg},${mb},0)`);
      g.fillStyle = gl; g.fillRect(x - rad, y - rad, 2 * rad, 2 * rad);

      g.fillStyle = `rgba(${ir},${ig},${ib},0.92)`;
      g.beginPath(); g.arc(x, y, W * 0.0022, 0, TAU); g.fill();
      rr();

}

// ---- T-shirt fabric pattern helper (strictly called inside active g.clip() of torso/sleeve)
function kumasDeseni(g, cx, y0, w, h, u, kolMu = false) {
  const desen = KARAKTER.kiyafet.desen;
  if (desen === 'duz') return;
  g.save();
  g.fillStyle = KIZ.desen;
  g.strokeStyle = KIZ.desen;
  g.globalAlpha = 0.72;
  if (desen === 'cicek') {
    const r = rng(kolMu ? 63 : 61), adet = kolMu ? 12 : 85;
    for (let i = 0; i < adet; i++) {
      const x = cx + (r() - 0.5) * w, y = y0 + r() * h;
      for (let p = 0; p < 4; p++) {
        g.beginPath(); g.arc(x + Math.cos(p * 1.57) * u * 0.004, y + Math.sin(p * 1.57) * u * 0.004, u * 0.0033, 0, TAU); g.fill();
      }
    }
  } else if (desen === 'yildiz') {
    const r = rng(kolMu ? 73 : 71), adet = kolMu ? 10 : 65;
    for (let i = 0; i < adet; i++) {
      const x = cx + (r() - 0.5) * w, y = y0 + r() * h, s = u * (0.0055 + (i % 3) * 0.0018);
      g.beginPath();
      g.moveTo(x, y - s); g.quadraticCurveTo(x, y, x + s, y);
      g.quadraticCurveTo(x, y, x, y + s); g.quadraticCurveTo(x, y, x - s, y);
      g.quadraticCurveTo(x, y, x, y - s); g.closePath(); g.fill();
    }
  } else if (desen === 'puantiye') {
    const adim = u * 0.028, rad = u * 0.0056;
    let satir = 0;
    for (let y = y0 - adim; y <= y0 + h + adim; y += adim * 0.86) {
      const kay = (satir++ % 2) * adim * 0.5;
      for (let x = cx - w * 0.6; x <= cx + w * 0.6; x += adim) {
        g.beginPath(); g.arc(x + kay, y, rad, 0, TAU); g.fill();
      }
    }
  } else if (desen === 'cizgili') {
    g.lineWidth = u * 0.0075;
    const adim = u * 0.022;
    for (let y = y0 - adim; y <= y0 + h + adim; y += adim) {
      g.beginPath();
      g.moveTo(cx - w * 0.65, y);
      g.quadraticCurveTo(cx, y + u * 0.012, cx + w * 0.65, y);
      g.stroke();
    }
  }
  g.restore();
}

    g.fillStyle = rgbaRenk(KIZ.tenKoyu, 0.22);
    g.beginPath();
    g.ellipse(wx + ux2 * u * 0.004, wy + uy2 * u * 0.004, w2 * 0.52, u * 0.008, Math.atan2(uy2, ux2) + Math.PI * 0.5, 0, TAU);
    g.fill();

    // 2. Two-segment articulated long sleeve (upper sleeve + overlapping forearm sleeve with rounded elbow cap)
    // so acute bends like 'selam' and 'su' never twist or self-intersect at the elbow
    const mx1 = (sx + ex) * 0.5, my1 = (sy + ey) * 0.5;
    const fx1 = lerp(ex, wx, 0.34), fy1 = lerp(ey, wy, 0.34);
    const fx2 = lerp(ex, wx, 0.72), fy2 = lerp(ey, wy, 0.72);
    // Crease direction points toward the inside of the bend between upper arm (-u1) and forearm (+u2)
    let bx = -ux1 + ux2, by = -uy1 + uy2, bLen = Math.hypot(bx, by);
    if (bLen < 0.05) { bx = in1x; by = in1y; bLen = 1; }
    const bnx = bx / bLen, bny = by / bLen;

    // 2a. Upper arm sleeve segment (shoulder to elbow cap)
    const ustKolKumasYol = () => {
      g.beginPath();
      g.moveTo(topShX, topShY);
      g.bezierCurveTo(
        sx + out1x * sw0 * 0.54, sy - u * 0.016 + out1y * sw0 * 0.32,
        mx1 + out1x * lerp(sw0, ew, 0.5) * 0.52, my1 + out1y * lerp(sw0, ew, 0.5) * 0.52,
        ex + out1x * ew * 0.50, ey + out1y * ew * 0.50
      );
      g.arc(ex, ey, ew * 0.50, Math.atan2(out1y, out1x), Math.atan2(in1y, in1x), dis > 0);
      g.quadraticCurveTo(
        mx1 + in1x * sw0 * 0.45, my1 + in1y * sw0 * 0.45,
        pitX, pitY
      );
      g.closePath();
    };

    g.save();
    ustKolKumasYol();
    g.fillStyle = KIZ.ust;
    g.fill();
    g.clip();
    if (model === 'kazak') {
      g.strokeStyle = rgbaRenk(KIZ.ustG, 0.28);
      g.lineWidth = Math.max(1.1, u * 0.0018);
      for (let k = -3; k <= 3; k++) {
        const off = k * u * 0.0075;
        g.beginPath();
        g.moveTo(sx + out1x * off, sy + out1y * off);
        g.lineTo(ex + out1x * off * 0.85, ey + out1y * off * 0.85);
        g.stroke();
      }
    }
    g.save();
    g.translate(mx1, my1);
    g.rotate(Math.atan2(dy1, dx1) - Math.PI * 0.5);
    kumasDeseni(g, 0, -L1 * 0.55, sw0 * 1.25, L1 * 1.15, u, true);
    g.restore();
    const sl1 = g.createLinearGradient(
      mx1 + out1x * sw0 * 0.55, my1 + out1y * sw0 * 0.55,
      mx1 + in1x * sw0 * 0.55, my1 + in1y * sw0 * 0.55
    );
    sl1.addColorStop(0, 'rgba(45,30,45,0.22)');
    sl1.addColorStop(0.45, 'rgba(255,255,255,0.09)');
    sl1.addColorStop(1, 'rgba(45,30,45,0.24)');
    g.fillStyle = sl1;
    g.fillRect(Math.min(sx, ex) - sw0, Math.min(sy, ey) - sw0, Math.abs(ex - sx) + sw0 * 2, Math.abs(ey - sy) + sw0 * 2);
    g.restore();

    // Outer & inner contour of upper sleeve
    g.strokeStyle = rgbaRenk(KIZ.ustG, 0.42);
    g.lineWidth = Math.max(1.3, u * 0.0021);
    g.beginPath();
    g.moveTo(topShX, topShY);
    g.bezierCurveTo(
      sx + out1x * sw0 * 0.54, sy - u * 0.016 + out1y * sw0 * 0.32,
      mx1 + out1x * lerp(sw0, ew, 0.5) * 0.52, my1 + out1y * lerp(sw0, ew, 0.5) * 0.52,
      ex + out1x * ew * 0.50, ey + out1y * ew * 0.50
    );
    g.moveTo(ex + in1x * ew * 0.50, ey + in1y * ew * 0.50);
    g.quadraticCurveTo(
      mx1 + in1x * sw0 * 0.45, my1 + in1y * sw0 * 0.45,
      pitX, pitY
    );
    g.stroke();

    // 2b. Forearm sleeve segment (elbow cap to wrist cuff)
    const altKolKumasYol = () => {
      g.beginPath();
      g.arc(ex, ey, ew * 0.50, Math.atan2(in2y, in2x), Math.atan2(out2y, out2x), dis < 0);
      g.bezierCurveTo(
        fx1 + out2x * ew * 0.49, fy1 + out2y * ew * 0.49,
        fx2 + out2x * cw * 0.53, fy2 + out2y * cw * 0.53,
        outWX, outWY
      );
      g.quadraticCurveTo(wx - ux2 * u * 0.006, wy - uy2 * u * 0.006, inWX, inWY);
      g.bezierCurveTo(
        fx2 + in2x * cw * 0.51, fy2 + in2y * cw * 0.51,
        fx1 + in2x * ew * 0.48, fy1 + in2y * ew * 0.48,
        ex + in2x * ew * 0.50, ey + in2y * ew * 0.50
      );
      g.closePath();
    };

    g.save();
    altKolKumasYol();
    g.fillStyle = KIZ.ust;
    g.fill();
    g.clip();

    if (model === 'kazak') {
      g.strokeStyle = rgbaRenk(KIZ.ustG, 0.28);
      g.lineWidth = Math.max(1.1, u * 0.0018);
      for (let k = -3; k <= 3; k++) {
        const off = k * u * 0.0070;
        g.beginPath();
        g.moveTo(ex + out2x * off * 0.85, ey + out2y * off * 0.85);
        g.lineTo(wx + out2x * off * 0.65, wy + out2y * off * 0.65);
        g.stroke();
      }
    }

    g.save();
    g.translate((ex + wx) * 0.5, (ey + wy) * 0.5);
    g.rotate(Math.atan2(dy2, dx2) - Math.PI * 0.5);
    kumasDeseni(g, 0, -L2 * 0.48, ew * 1.2, L2 * 0.96, u, true);
    g.restore();

    const mx2 = (ex + wx) * 0.5, my2 = (ey + wy) * 0.5;
    const sl2 = g.createLinearGradient(
      mx2 + out2x * ew * 0.55, my2 + out2y * ew * 0.55,
      mx2 + in2x * ew * 0.55, my2 + in2y * ew * 0.55
    );
    sl2.addColorStop(0, 'rgba(45,30,45,0.22)');
    sl2.addColorStop(0.45, 'rgba(255,255,255,0.09)');
    sl2.addColorStop(1, 'rgba(45,30,45,0.20)');
    g.fillStyle = sl2;
    g.fillRect(Math.min(ex, wx) - ew, Math.min(ey, wy) - ew, Math.abs(wx - ex) + ew * 2, Math.abs(wy - ey) + ew * 2);

    // Wrist cuff band (bilekte manşet/kat)
    const cuffLen = u * (model === 'uzunkollu' ? 0.022 : 0.028);
    const c0x = wx - ux2 * cuffLen, c0y = wy - uy2 * cuffLen;
    g.fillStyle = rgbaRenk(KIZ.ustG, model === 'uzunkollu' ? 0.22 : 0.34);
    g.beginPath();
    g.moveTo(c0x + out2x * cw * 0.58, c0y + out2y * cw * 0.58);
    g.quadraticCurveTo(c0x - ux2 * u * 0.006, c0y - uy2 * u * 0.006, c0x + in2x * cw * 0.58, c0y + in2y * cw * 0.58);
    g.lineTo(inWX, inWY);
    g.quadraticCurveTo(wx - ux2 * u * 0.006, wy - uy2 * u * 0.006, outWX, outWY);
    g.closePath();
    g.fill();

    // Cuff top seam + rib lines
    g.strokeStyle = rgbaRenk(KIZ.ustG, 0.48);
    g.lineWidth = Math.max(1.2, u * 0.002);
    g.beginPath();
    g.moveTo(c0x + out2x * cw * 0.54, c0y + out2y * cw * 0.54);
    g.quadraticCurveTo(c0x - ux2 * u * 0.006, c0y - uy2 * u * 0.006, c0x + in2x * cw * 0.52, c0y + in2y * cw * 0.52);
    g.stroke();
    if (model === 'kapusonlu' || model === 'kazak') {
      g.lineWidth = Math.max(1.0, u * 0.0016);
      for (let r = -2; r <= 2; r++) {
        const ro = r * cw * 0.16;
        g.beginPath();
        g.moveTo(c0x + out2x * ro, c0y + out2y * ro);
        g.lineTo(wx + out2x * ro, wy + out2y * ro);
        g.stroke();
      }
    }

    // Elbow fabric creases (dirsekte kırışıklık çizgileri)
    g.fillStyle = rgbaRenk(KIZ.ustG, 0.24);
    g.beginPath();
    g.ellipse(ex + bnx * ew * 0.18, ey + bny * ew * 0.18, ew * 0.32, ew * 0.14, Math.atan2(bny, bnx) + Math.PI * 0.5, 0, TAU);
    g.fill();

    g.strokeStyle = rgbaRenk(KIZ.ustG, 0.50);
    g.lineWidth = Math.max(1.4, u * 0.0022);
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(ex + bnx * ew * 0.46, ey + bny * ew * 0.46);
    g.quadraticCurveTo(ex + bnx * ew * 0.14, ey + bny * ew * 0.14, ex - bnx * ew * 0.08 + ux2 * ew * 0.12, ey - bny * ew * 0.08 + uy2 * ew * 0.12);
    g.moveTo(ex + bnx * ew * 0.42 - ux1 * ew * 0.14, ey + bny * ew * 0.42 - uy1 * ew * 0.14);
    g.quadraticCurveTo(ex + bnx * ew * 0.18 - ux1 * ew * 0.06, ey + bny * ew * 0.18 - uy1 * ew * 0.06, ex - ux1 * ew * 0.04, ey - uy1 * ew * 0.04);
    g.moveTo(ex + bnx * ew * 0.42 + ux2 * ew * 0.14, ey + bny * ew * 0.42 + uy2 * ew * 0.14);
    g.quadraticCurveTo(ex + bnx * ew * 0.18 + ux2 * ew * 0.06, ey + bny * ew * 0.18 + uy2 * ew * 0.06, ex + ux2 * ew * 0.05, ey + uy2 * ew * 0.05);
    g.stroke();
    g.restore();

    // Forearm outer & inner contour + wrist cuff rim (without internal elbow circle seam)
    g.strokeStyle = rgbaRenk(KIZ.ustG, 0.42);
    g.lineWidth = Math.max(1.3, u * 0.0021);
    g.beginPath();
    g.moveTo(ex + out2x * ew * 0.50, ey + out2y * ew * 0.50);
    g.bezierCurveTo(
      fx1 + out2x * ew * 0.49, fy1 + out2y * ew * 0.49,
      fx2 + out2x * cw * 0.53, fy2 + out2y * cw * 0.53,
      outWX, outWY
    );
    g.quadraticCurveTo(wx - ux2 * u * 0.006, wy - uy2 * u * 0.006, inWX, inWY);
    g.bezierCurveTo(
      fx2 + in2x * cw * 0.51, fy2 + in2y * cw * 0.51,
      fx1 + in2x * ew * 0.48, fy1 + in2y * ew * 0.48,
      ex + in2x * ew * 0.50, ey + in2y * ew * 0.50
    );
    g.stroke();

    // Shoulder armhole stitch seam
    g.strokeStyle = rgbaRenk(KIZ.ustG, 0.36);
    g.lineWidth = Math.max(1, u * 0.002);
    g.beginPath();
    g.moveTo(topShX + dis * u * 0.004, topShY + u * 0.002);
    g.quadraticCurveTo(sx - dis * u * 0.006, sy + u * 0.015, pitX, pitY - u * 0.004);
    g.stroke();

    return [ex, ey, Math.atan2(hy - ey, hx - ex)];
  }

  // 1. Dark interior back rim of the sleeve opening (drawn behind the bare upper arm so the arm emerges from inside the fabric cylinder)
  if (model !== 'askili') {
    g.fillStyle = renkKaristir(KIZ.ust, '#1c1220', 0.48);
    g.beginPath();
    g.moveTo(outCuffX, outCuffY);
    g.quadraticCurveTo(kx + ux1 * u * 0.008, ky + uy1 * u * 0.008, inCuffX, inCuffY);
    g.quadraticCurveTo(kx - ux1 * u * 0.010, ky - uy1 * u * 0.010, outCuffX, outCuffY);
    g.closePath();
    g.fill();
  }

  // 2. Upper arm with perpendicular cylindrical shading and subtle bicep/deltoid curve
  const mx1 = (sx + ex) * 0.5, my1 = (sy + ey) * 0.5;
  const upGr = g.createLinearGradient(
    mx1 + out1x * w0 * 0.55, my1 + out1y * w0 * 0.55,
    mx1 + in1x * w0 * 0.55, my1 + in1y * w0 * 0.55
  );
  upGr.addColorStop(0, KIZ.tenG);
  upGr.addColorStop(0.45, KIZ.ten);
  upGr.addColorStop(0.82, KIZ.tenAcik);
  upGr.addColorStop(1, KIZ.ten);

  const sxArm = model === 'askili' ? sx : lerp(sx, ex, 0.18), syArm = model === 'askili' ? sy : lerp(sy, ey, 0.18);
  const ustKolYol = () => {
    g.beginPath();
    if (model === 'askili') {
      // Full bare shoulder deltoid cap connecting seamlessly to bare shoulder/trapezius
      g.moveTo(sx - dis * u * 0.045, sy - u * 0.024);
      g.bezierCurveTo(
        sx + out1x * w0 * 0.48, sy - u * 0.008 + out1y * w0 * 0.20,
        mx1 + out1x * w0 * 0.50, my1 + out1y * w0 * 0.50,
        ex + out1x * w1 * 0.50, ey + out1y * w1 * 0.50
      );
      g.arc(ex, ey, w1 * 0.50, Math.atan2(out1y, out1x), Math.atan2(in1y, in1x), dis > 0);
      g.quadraticCurveTo(mx1 + in1x * w0 * 0.46, my1 + in1y * w0 * 0.46, sx - dis * u * 0.028, sy + u * 0.042);
      g.closePath();
      return;
    }
    g.moveTo(sxArm + out1x * w0 * 0.46, syArm + out1y * w0 * 0.46);
    g.quadraticCurveTo(mx1 + out1x * w0 * 0.50, my1 + out1y * w0 * 0.50, ex + out1x * w1 * 0.50, ey + out1y * w1 * 0.50);
    g.arc(ex, ey, w1 * 0.50, Math.atan2(out1y, out1x), Math.atan2(in1y, in1x), dis > 0);
    g.quadraticCurveTo(mx1 + in1x * w0 * 0.46, my1 + in1y * w0 * 0.46, sxArm + in1x * w0 * 0.44, syArm + in1y * w0 * 0.44);
    g.closePath();
  };
  g.save();
  ustKolYol();
  g.fillStyle = upGr;
  g.fill();
  g.clip();
  if (model !== 'askili') {
    // Soft curved cast shadow from the sleeve cuff onto the emerging upper arm skin
    g.fillStyle = rgbaRenk(KIZ.tenKoyu, 0.22);
    g.beginPath();
    g.moveTo(outCuffX - ux1 * u * 0.02, outCuffY - uy1 * u * 0.02);
    g.lineTo(outCuffX + ux1 * u * 0.005, outCuffY + uy1 * u * 0.005);
    g.quadraticCurveTo(kx - ux1 * u * 0.003, ky - uy1 * u * 0.003, inCuffX + ux1 * u * 0.005, inCuffY + uy1 * u * 0.005);
    g.lineTo(inCuffX - ux1 * u * 0.02, inCuffY - uy1 * u * 0.02);
    g.closePath();
    g.fill();
  }
  g.restore();

  // Subtle anatomical contour on bare upper arm edges
  g.strokeStyle = KIZ.tenCizgi;
  g.lineWidth = Math.max(1.1, u * 0.0018);
  g.lineCap = 'round';
  g.beginPath();
  if (model === 'askili') {
    g.moveTo(sx - dis * u * 0.045, sy - u * 0.024);
    g.bezierCurveTo(
      sx + out1x * w0 * 0.48, sy - u * 0.008 + out1y * w0 * 0.20,
      mx1 + out1x * w0 * 0.50, my1 + out1y * w0 * 0.50,
      ex + out1x * w1 * 0.50, ey + out1y * w1 * 0.50
    );
    g.moveTo(lerp(sx, ex, 0.18) + in1x * w0 * 0.44, lerp(sy, ey, 0.18) + in1y * w0 * 0.44);
    g.quadraticCurveTo(mx1 + in1x * w0 * 0.46, my1 + in1y * w0 * 0.46, ex + in1x * w1 * 0.48, ey + in1y * w1 * 0.48);
  } else {
    g.moveTo(kx + out1x * lerp(w0, w1, kCuff) * 0.50, ky + out1y * lerp(w0, w1, kCuff) * 0.50);
    g.quadraticCurveTo(lerp(kx, ex, 0.5) + out1x * lerp(w0, w1, 0.72) * 0.50, lerp(ky, ey, 0.5) + out1y * lerp(w0, w1, 0.72) * 0.50, ex + out1x * w1 * 0.50, ey + out1y * w1 * 0.50);
    g.moveTo(kx + in1x * lerp(w0, w1, kCuff) * 0.47, ky + in1y * lerp(w0, w1, kCuff) * 0.47);
    g.quadraticCurveTo(lerp(kx, ex, 0.5) + in1x * lerp(w0, w1, 0.72) * 0.47, lerp(ky, ey, 0.5) + in1y * lerp(w0, w1, 0.72) * 0.47, ex + in1x * w1 * 0.48, ey + in1y * w1 * 0.48);
  }
  g.stroke();

  // Selamda on kol, govde ve kisa kol kumasinin onunde kalir.
  const onKolOnde = CANLI_KARE?.ad === 'selam' && dis > 0;
  if (onKolOnde) kisaKolCiz();

  // 3. Forearm with distinct cylindrical shading, proximal muscle fullness, tapering smoothly to wrist w2
  const mx2 = lerp(ex, hx, 0.45), my2 = lerp(ey, hy, 0.45);
  const foreGr = g.createLinearGradient(
    mx2 + out2x * w1 * 0.55, my2 + out2y * w1 * 0.55,
    mx2 + in2x * w1 * 0.55, my2 + in2y * w1 * 0.55
  );
  foreGr.addColorStop(0, KIZ.tenG);
  foreGr.addColorStop(0.42, KIZ.ten);
  foreGr.addColorStop(0.78, KIZ.tenAcik);
  foreGr.addColorStop(1, KIZ.ten);

  const fx1 = lerp(ex, hx, 0.28), fy1 = lerp(ey, hy, 0.28), fw1 = w1 * 0.98;
  const fx2 = lerp(ex, hx, 0.70), fy2 = lerp(ey, hy, 0.70);
  g.fillStyle = foreGr;
  g.beginPath();
  // Start around elbow cap so outer elbow bend is smooth and solid
  g.arc(ex, ey, w1 * 0.50, Math.atan2(in2y, in2x), Math.atan2(out2y, out2x), dis < 0);
  g.bezierCurveTo(
    fx1 + out2x * fw1 * 0.52, fy1 + out2y * fw1 * 0.52,
    fx2 + out2x * w2 * 0.53, fy2 + out2y * w2 * 0.53,
    hx + out2x * w2 * 0.50, hy + out2y * w2 * 0.50
  );
  g.arc(hx, hy, w2 * 0.50, Math.atan2(out2y, out2x), Math.atan2(in2y, in2x), dis > 0);
  g.bezierCurveTo(
    fx2 + in2x * w2 * 0.52, fy2 + in2y * w2 * 0.52,
    fx1 + in2x * fw1 * 0.52, fy1 + in2y * fw1 * 0.52,
    ex + in2x * w1 * 0.48, ey + in2y * w1 * 0.48
  );
  g.closePath();
  g.fill();

  // Forearm edge contours + outer elbow curve + distinct inner elbow bend crease (cubital fold)
  g.strokeStyle = KIZ.tenCizgi;
  g.lineWidth = Math.max(1.1, u * 0.0018);
  g.beginPath();
  // Outer elbow & forearm contour
  g.arc(ex, ey, w1 * 0.50, Math.atan2(in2y, in2x), Math.atan2(out2y, out2x), dis < 0);
  g.bezierCurveTo(
    fx1 + out2x * fw1 * 0.52, fy1 + out2y * fw1 * 0.52,
    fx2 + out2x * w2 * 0.53, fy2 + out2y * w2 * 0.53,
    hx + out2x * w2 * 0.50, hy + out2y * w2 * 0.50
  );
  // Inner forearm contour
  g.moveTo(ex + in2x * w1 * 0.48, ey + in2y * w1 * 0.48);
  g.bezierCurveTo(
    fx1 + in2x * fw1 * 0.52, fy1 + in2y * fw1 * 0.52,
    fx2 + in2x * w2 * 0.52, fy2 + in2y * w2 * 0.52,
    hx + in2x * w2 * 0.50, hy + in2y * w2 * 0.50
  );
  g.stroke();

  // Inner elbow crease (belirgin dirsek bükülme çizgisi ve hafif gölgesi)
  let bx = -ux1 + ux2, by = -uy1 + uy2, bLen = Math.hypot(bx, by);
  if (bLen < 0.05) { bx = in1x; by = in1y; bLen = 1; }
  const bnx = bx / bLen, bny = by / bLen;
  g.fillStyle = rgbaRenk(KIZ.tenKoyu, 0.16);
  g.beginPath();
  g.ellipse(ex + bnx * w1 * 0.18, ey + bny * w1 * 0.18, w1 * 0.32, w1 * 0.14, Math.atan2(bny, bnx) + Math.PI * 0.5, 0, TAU);
  g.fill();
  g.strokeStyle = rgbaRenk(KIZ.tenKoyu, 0.42);
  g.lineWidth = Math.max(1.4, u * 0.0022);
  g.beginPath();
  g.moveTo(ex + bnx * w1 * 0.48, ey + bny * w1 * 0.48);
  g.quadraticCurveTo(ex + bnx * w1 * 0.16, ey + bny * w1 * 0.16, ex - bnx * w1 * 0.08 + ux2 * w1 * 0.12, ey - bny * w1 * 0.08 + uy2 * w1 * 0.12);
  g.stroke();

  // 4. Short-sleeve (or elbow-rolled 'gomlek' sleeve) front fabric wrapping around the upper arm
  if (!onKolOnde) kisaKolCiz();
  return [ex, ey, Math.atan2(hy - ey, hx - ex)];

  function kisaKolCiz() {
    if (model === 'askili') {
      return;
    }
    const kolGomlekYol = () => {
      g.beginPath();
      g.moveTo(topShX, topShY);
      // Smooth outer shoulder cap down to outer sleeve cuff
      g.bezierCurveTo(
        sx + out1x * sw0 * 0.54, sy - u * 0.016 + out1y * sw0 * 0.32,
        lerp(sx, kx, 0.62) + out1x * sw1 * 0.54, lerp(sy, ky, 0.62) + out1y * sw1 * 0.54,
        outCuffX, outCuffY
      );
      // 3D upward-arching cuff opening wrapping across the front of the upper arm cylinder
      g.quadraticCurveTo(kx - ux1 * u * 0.009, ky - uy1 * u * 0.009, inCuffX, inCuffY);
      // Inner sleeve edge back up to armpit

  pan: (c, e, a, b) => { c.pan += lerp(a, b, e); },           // turn: screen shift, no parallax (+ = right)
  tilt: (c, e, a, b) => { c.tilt += lerp(a, b, e); },         // + = up
  dolly: (c, e, a, b) => { c.dist = lerp(a, b, e); },         // dolly in: b < a
  zoom: (c, e, a, b) => { c.focal = lerp(a, b, e); },         // zoom in: b > a (no parallax)
  truck: (c, e, a, b) => { c.x = lerp(a, b, e); },            // tracking / truck: camera moves sideways (+ = right)
  crane: (c, e, a, b) => { c.y = -lerp(a, b, e); },           // crane / pedestal: + = up

  handheld: (c, t, amount = 1, salt = 3) => {                 // seeded, low-passed (0.3-1.1 Hz); never per-frame jitter

    try {
      const r=await fetch('/karakter.json',{signal:AbortSignal.timeout(2500)});
      if(r.ok){const j=await r.json();if(j&&typeof j==='object'&&Object.keys(j).length)karakterUygula(j,false);}
    } catch {/* sunucu yoksa varsayılan */}
  }
  const urlKar=q.get('karakter');
  if(urlKar){const cozulmus=base64JsonCoz(urlKar);if(cozulmus)karakterUygula(cozulmus,false);}
}
addEventListener('message',e=>{
  const d=e.data;if(!d||typeof d!=='object')return;
  if(['karakter','kamera','aksiyon','konus','yorum','izleyici','begeni'].includes(d.tur))window.canli.olay(d);
});

function canliCiz(now,dt) {
  const Y=canliYonetmen;
  try {
    const L=Y.kare(now,dt);
    const target=bufOut.g;target.setTransform(1,0,0,1,0,0);target.globalAlpha=1;target.filter='none';
    target.save();sYayin(target,0,L.t,S);target.restore();
    g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.filter='none';   // renk ayarı + ton eğrisi tuvalin CSS süzgecinde (canvas.style.filter), her karede tuval içinde değil
    g.drawImage(bufOut.c,0,0);vignette(g,S,LOOK.vignette);
    canliArayuz(L,now);
    if(Y.current&&L.age>=Y.current.duration){Y.current=null;Y.nextIdle=now+20+Math.random()*25;}
  } finally {CANLI_KARE=null;}
}
if(!q.get('capture')) {
  canvas.style.filter=[LOOK.grade,TONE&&'url(#tone)'].filter(Boolean).join(' ')||'none';   // yalnız canlı modda; capture modu süzgeci kendi içinde uygular
  const button=document.getElementById('baslat'),obs=q.get('obs')==='1'||q.get('onizleme')==='1';button.hidden=obs;
  let ready=false,requested=obs;
  const start=()=>{
    requested=true;button.hidden=true;
    canliSes.baslat().catch(error=>{canliYonetmen.lastError=error.message;});
    if(!ready||canliYonetmen.started)return;
    const now=performance.now()/1000;Object.assign(canliYonetmen,{started:true,last:now,nextIdle:now+20+Math.random()*25,nextDemo:now+5});
  };
  button.addEventListener('click',start);
  Promise.all([window.READY,ilkKarakterYukle()]).then(()=>{
    ready=true;
    if(requested)start();else canliCiz(performance.now()/1000,0);
    if(q.get('demo')!=='1'&&location.protocol!=='file:') {
      const events=new EventSource('/olaylar');canliYonetmen.connection='bağlanıyor';
      events.onopen=()=>{canliYonetmen.connection='bağlı';};
      events.onerror=()=>{canliYonetmen.connection='yeniden bağlanıyor';};
      events.onmessage=e=>{try{window.canli.olay(JSON.parse(e.data));}catch{/* Ignore malformed events. */}};
      addEventListener('pagehide',()=>events.close(),{once:true});
    }
    const loop=()=>{
      const now=performance.now()/1000,Y=canliYonetmen;
      if(Y.started){const dt=Math.max(0,now-Y.last);Y.last=now;canliCiz(now,dt);Y.frames.push(now);while(Y.frames.length&&Y.frames[0]<now-2)Y.frames.shift();Y.bildir(now);}
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }).catch(error=>{button.hidden=false;button.textContent='Sahne yüklenemedi';canliYonetmen.lastError=error.message;console.error(error);});
}

</script>
